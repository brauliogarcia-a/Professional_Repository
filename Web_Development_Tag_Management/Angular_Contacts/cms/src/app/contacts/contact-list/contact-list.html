<!-- This panel contains the contact list section. -->
<div class="panel panel-default">

  <!-- This is the header of the contacts panel. -->
  <div class="panel-heading clearfix">

    <!-- This is the title of the panel, shown on the left side. -->
    <div class="contact-title">
      <span class="title">Contacts</span>
    </div>

    <div class="row">
      <!-- This input lets the user search contacts by name. -->
      <div class="input-group contact-search">
        <input
          type="text"
          class="form-control"
          #searchBox
          placeholder="Search contacts"
          (keyup)="search(searchBox.value)"
        />
        <div class="glyphicon glyphicon-search input-group-addon" (click)="search(searchBox.value)"></div>
      </div>

      <!-- This button routes to the form used to add a new contact. -->
      <div class="contact-new-button">
        <a class="btn btn-success" [routerLink]="['new']">New Contact</a>
      </div>
    </div>
  </div>

  <!-- This is the main body of the panel. -->
  <div class="panel-body">

    <!-- This repeats one contact item component for each contact in the contacts array. -->
    <!-- routerLink sends the user to the detail route for the selected contact. -->
    <cms-contact-item
      *ngFor="let contact of contacts | contactFilter: term"
      [contact]="contact"
      [routerLink]="[contact.id]"
      (click)="onSelected(contact)"
    ></cms-contact-item>
  </div>
</div>
