<!-- This panel contains the contact list section. -->
<div class="panel panel-default">

  <!-- This is the header of the contacts panel. -->
  <div class="panel-heading clearfix">

    <!-- This is the title of the panel, shown on the left side. -->
    <h3 class="panel-title pull-left">Contacts</h3>

    <!-- This button routes to the form used to add a new contact. -->
    <a class="btn btn-success pull-right" [routerLink]="['new']">New Contact</a>
  </div>

  <!-- This is the main body of the panel. -->
  <div class="panel-body">

    <!-- This repeats one contact item component for each contact in the contacts array. -->
    <!-- routerLink sends the user to the detail route for the selected contact. -->
    <cms-contact-item
      *ngFor="let contact of contacts"
      [contact]="contact"
      [routerLink]="[contact.id]"
      (click)="onSelected(contact)"
    ></cms-contact-item>
  </div>
</div>
