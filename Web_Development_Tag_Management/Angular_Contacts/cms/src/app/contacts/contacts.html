  <!-- This column shows the contact list on the left side. -->
  <div class="col-md-5">

    <!-- This shows the contact list component. -->
    <cms-contact-list></cms-contact-list>
  </div>

  <!-- This column shows the selected contact detail or the contact edit form. -->
  <div class="col-md-4">

    <!-- The child routes load ContactDetail or ContactEdit here. -->
    <router-outlet></router-outlet>
  </div>

</div>
