<!-- This panel shows the details of the selected contact. -->
<!-- *ngIf checks if there is a contact selected before showing the panel. -->
<!-- "contact as selectedContact" gives the contact a local name to use in this template. -->
<div class="panel panel-default" *ngIf="contact as selectedContact">

  <!-- This is the header of the contact detail panel. -->
  <div class="panel-heading clearfix">

    <!-- This shows the selected contact name on the left side. -->
    <h3 class="panel-title pull-left">{{ selectedContact.name }}</h3>

    <!-- This section shows the action buttons on the right side. -->
    <div class="pull-right">

      <!-- This button can be used later to edit the selected contact. -->
      <a class="btn btn-primary">Edit</a>

      <!-- This button can be used later to delete the selected contact. -->
      <a class="btn btn-danger">Delete</a>
    </div>
  </div>

  <!-- This is the main body of the contact detail panel. -->
  <div class="panel-body">

    <!-- This row helps organize the contact information. -->
    <div class="row">

      <!-- This column uses the full width on extra small screens. -->
      <div class="col-xs-12">

        <!-- This shows the email of the selected contact. -->
        <p><strong>Email:</strong> {{ selectedContact.email }}</p>

        <!-- This shows the phone number of the selected contact. -->
        <p><strong>Phone:</strong> {{ selectedContact.phone }}</p>
      </div>
    </div>
  </div>
</div>
