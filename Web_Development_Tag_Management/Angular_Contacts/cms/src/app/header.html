<!-- This creates the main navigation bar. -->
<nav class="navbar navbar-default">

  <!-- This keeps the navbar content inside a fluid container. -->
  <div class="container-fluid">

    <!-- This section contains the name or brand of the application. -->
    <div class="navbar-header">

      <!-- This is the application title shown on the navbar. -->
      <!-- routerLink sends the user to the documents route when they click the title. -->
      <a class="navbar-brand" routerLink="/documents">WeLearn CMS</a>
    </div>

    <!-- This list contains the main navigation options. -->
    <ul class="nav navbar-nav">

      <!-- routerLink changes the URL and shows the Documents component. -->
      <!-- routerLinkActive adds the active class when this route is selected. -->
      <li routerLinkActive="active"><a routerLink="/documents">Documents</a></li>

      <!-- routerLink changes the URL and shows the Messages component. -->
      <!-- routerLinkActive adds the active class when this route is selected. -->
      <li routerLinkActive="active"><a routerLink="/messages">Messages</a></li>

      <!-- routerLink changes the URL and shows the Contacts component. -->
      <!-- routerLinkActive adds the active class when this route is selected. -->
      <li routerLinkActive="active"><a routerLink="/contacts">Contacts</a></li>
    </ul>

    <!-- This list is aligned to the right side of the navbar. -->
    <ul class="nav navbar-nav navbar-right">

      <!-- This creates a dropdown area for the user menu. -->
      <!-- cmsDropdown uses the custom directive to open and close this dropdown. -->
      <li class="dropdown" cmsDropdown>

        <!-- This is the user dropdown link shown in the navbar. -->
        <a href="#" class="dropdown-toggle" role="button">
          User <span class="caret"></span>
        </a>

        <!-- This is the menu that appears when the dropdown is open. -->
        <ul class="dropdown-menu">
          <li><a href="#">Save Data</a></li>
          <li><a href="#">Fetch Data</a></li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
